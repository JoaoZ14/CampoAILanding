# Atualiza cotacoes.json 1x por dia usando Agrobr e commita no repositório.
#
# Horário: 12:10 em Brasília (UTC−3) ≈ 15:10 UTC.
# Execução manual: Actions → "Atualizar cotações (Agrobr)" → Run workflow

name: Atualizar cotações (Agrobr)

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cotacoes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cotacoes.txt

      - name: Gerar cotacoes.json
        run: python scripts/update-cotacoes.py

      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotacoes.json
          if git diff --staged --quiet; then
            echo "Sem alterações em cotacoes.json."
          else
            git commit -m "chore: atualizar cotações (Agrobr)"
            git push
          fi

